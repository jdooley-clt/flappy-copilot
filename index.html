<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLAPPY COPILOT — a retro terminal game</title>
<script src="./src/theme.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1 class="page-title">~/MonasRepo [⎇ main] — flappy-copilot.exe</h1>
    <div id="wrap">
      <canvas id="game" width="480" height="640"></canvas>
      <div class="scanlines"></div>
    </div>
    <div class="hint">
      <span><b>SPACE</b> / click to flap · <b>P</b> pause · <b>M</b> mute · Ctrl+c Exit</span>
      <button id="pause-button" class="pause-button" type="button" aria-keyshortcuts="P">Pause</button>
      <a class="arcade-link" href="https://jdooley-clt.github.io/arcade/" hidden>GitHub Arcade</a>
    </div>
    <p id="status" class="visually-hidden" role="status"></p>
  </main>

<script src="./src/main.js"></script>
</body>
</html>
